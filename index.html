async function geocodeOne(s){
  if(markers.has(s.idx))return true;
  return new Promise(resolve=>{
    geocoder.geocode({address:s.address,region:'TW',componentRestrictions:{country:'TW'}},(results,status)=>{
      if(status==='OK'&&results&&results[0]){
        const loc=results[0].geometry.location;
        const p={lat:loc.lat(),lng:loc.lng()};
        cache[s.address]=p;saveCache();addMarker(s,p);updateStatus();resolve(true);
      }else if(status==='OVER_QUERY_LIMIT'){resolve('retry')}
      else resolve(false);
    })
  })
}

 const townKeys=['town','district','鄉鎮','區名','鄉名'];
 if(district){const cityOK=match(cityKeys,city)||entries.some(([k,v])=>k.includes('countyname')&&v===boundaryName(city));const districtOK=match(townKeys,district)||entries.some(([k,v])=>['name','名稱'].some(key=>k.includes(key))&&v===boundaryName(district));return cityOK&&districtOK;}

// Exclude offshore components from administrative outlines, except the four approved islands.
const APPROVED_ISLANDS=[
 {name:'金門',lat:[24.35,24.55],lng:[118.15,118.52]},
 {name:'澎湖',lat:[23.15,23.85],lng:[119.25,119.85]},
 {name:'蘭嶼',lat:[21.93,22.12],lng:[121.45,121.65]},
 {name:'綠島',lat:[22.58,22.75],lng:[121.43,121.58]}
];
const MAINLAND_CITIES=new Set(['基隆市','台北市','新北市','桃園市','新竹市','新竹縣','苗栗縣','台中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','台南市','高雄市','屏東縣','宜蘭縣','花蓮縣','台東縣']);
let mainlandPolygonCache=null;
function boundaryRings(geometry){
 if(!geometry)return[];
 if(geometry.type==='Polygon')return [geometry.coordinates];
 if(geometry.type==='MultiPolygon')return geometry.coordinates;
 return[];
}
function ringArea(ring){
 let sum=0;
 for(let i=0;i<ring.length;i++){const a=ring[i],b=ring[(i+1)%ring.length];sum+=a[0]*b[1]-b[0]*a[1]}

}
function polygonSample(poly){
 const ring=poly[0]||[];
 if(!ring.length)return null;
 let x=0,y=0;
 for(const p of ring){x+=p[0];y+=p[1]}

}
function pointInsideRing(point,ring){
 let inside=false;
 for(let i=0,j=ring.length-1;i<ring.length;j=i++){
  const a=ring[i],b=ring[j];
  if(((a[1]>point[1])!==(b[1]>point[1]))&&(point[0]<(b[0]-a[0])*(point[1]-a[1])/(b[1]-a[1])+a[0]))inside=!inside;

}

async function mainlandBoundaryPolygons(){
 if(!mainlandPolygonCache){
  mainlandPolygonCache=loadBoundary('city').then(geo=>{
   const mainland=[];
   for(const f of geo.features||[]){
    const city=Object.values(f.properties||{}).map(boundaryName);
    if(!city.some(v=>MAINLAND_CITIES.has(v)))continue;
    const polygons=boundaryRings(f.geometry);
    if(!polygons.length)continue;
    // Each mainland county/city contributes its largest continuous landmass.
    const largest=polygons.reduce((best,p)=>ringArea(p[0]||[])>ringArea(best[0]||[])?p:best);
    mainland.push(largest);
   }
   return mainland;
  }).catch(e=>{mainlandPolygonCache=null;throw e});

function keepBoundaryPolygon(poly,mainland,city,district){

 const [lng,lat]=point;
 const approved=APPROVED_ISLANDS.find(i=>lat>=i.lat[0]&&lat<=i.lat[1]&&lng>=i.lng[0]&&lng<=i.lng[1]);
 if(approved){
  if(approved.name==='金門'||approved.name==='澎湖')return boundaryName(city).includes(approved.name);
  return approved.name==='蘭嶼'?boundaryName(district)==='蘭嶼鄉'||!district:boundaryName(district)==='綠島鄉'||!district;

// Google-listed hours are consulted only when opening a district list; unknown is never shown as closed.
// Self-owned weekly schedules only. No Google Places calls or permanent Google-data caching.
const STORE_HOURS_KEY='comebuy_store_weekly_hours_v1';
let storeWeeklyHours={};
try{const x=JSON.parse(localStorage.getItem(STORE_HOURS_KEY)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))storeWeeklyHours=x}catch(e){}
function storeHoursId(s){return [s.brand||'COMEBUY',s.name,s.address].join('|')}
function storeHoursNow(s){
 const schedule=storeWeeklyHours[storeHoursId(s)];
 if(!schedule||!Array.isArray(schedule.days)||schedule.days.length!==7)return null;
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
 const field=t=>parts.find(p=>p.type===t)?.value;
 const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(field('weekday'));
 const mins=Number(field('hour'))%24*60+Number(field('minute'));
 if(day<0)return null;
 const valid=t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t||'');
 const time=t=>Number(t.slice(0,2))*60+Number(t.slice(3,5));
 for(const offset of [0,-1]){
  const entry=schedule.days[(day+offset+7)%7];
  if(!entry||entry.closed||!valid(entry.open)||!valid(entry.close))continue;
  const start=time(entry.open)+offset*1440;
  let end=time(entry.close)+offset*1440;
  if(end<=start)end+=1440;
  if(mins>=start&&mins<end)return true;
 }
 return false;
}

function vacancyIcon(status){

function refreshVacancyMarkers(){
 if(!map)return;
 const ids=new Set(vacancies.filter(v=>!v.archived).map(v=>v.id));
 vacancyMarkers.forEach((m,id)=>{if(!ids.has(id)){m.setMap(null);vacancyMarkers.delete(id)}});

  if(!v.position||!Number.isFinite(+v.position.lat)||!Number.isFinite(+v.position.lng))return;
  let m=vacancyMarkers.get(v.id);
  if(!m){
   m=new google.maps.Marker({position:v.position,map:vacancyVisible?map:null,title:v.address,icon:vacancyIcon(v.status),zIndex:200});
   m.addListener('click',()=>{const item=vacancies.find(x=>x.id===v.id);if(!item)return;openVacancyPopup(item,m)});
   vacancyMarkers.set(v.id,m);
  }
  m.setIcon(vacancyIcon(v.status));m.setMap(vacancyVisible?map:null);
 });
 const archivedIds=new Set(vacancies.filter(v=>v.archived).map(v=>v.id));
 archivedVacancyMarkers.forEach((m,id)=>{if(!archivedIds.has(id)){m.setMap(null);archivedVacancyMarkers.delete(id)}});
 vacancies.filter(v=>v.archived).forEach(v=>{

  if(!m){m=new google.maps.Marker({position:v.position,map:null,title:v.address,icon:archivedVacancyIcon(),zIndex:190});m.addListener('click',()=>{const item=vacancies.find(x=>x.id===v.id);if(item)locateVacancy(item)});archivedVacancyMarkers.set(v.id,m)}
  m.setMap(archivedVacancyVisible?map:null);
 });

const AREA_TYPES=['住宅生活型','辦公商務型','商業購物型','學區校園型','交通轉運型','觀光休閒型','工業園區型','複合混合型'];
const vacancyAreaNames=v=>Array.isArray(v.areaTypes)?v.areaTypes.filter(t=>AREA_TYPES.includes(t)):(AREA_TYPES.includes(v.areaType)?[v.areaType]:[]);
function geocodeVacancy(v){
 return new Promise(resolve=>{
  if(!geocoder){resolve(false);return}
  geocoder.geocode({address:v.address,region:'TW',componentRestrictions:{country:'TW'}},(results,status)=>{
   if(status==='OK'&&results?.[0]){
    const loc=results[0].geometry.location;
    v.position={lat:loc.lat(),lng:loc.lng()};
    const parts=results[0].address_components||[];
    const part=t=>parts.find(c=>c.types?.includes(t))?.long_name||'';
    v.region={city:part('administrative_area_level_1')||part('administrative_area_level_2'),district:part('administrative_area_level_3')||part('sublocality_level_1')||part('sublocality'),neighborhood:part('administrative_area_level_4')||part('sublocality_level_2')||part('neighborhood')};
    if(!v.areaManual)v.areaType=v.areaType||'待調查';
    saveVacancies();refreshVacancyMarkers();resolve(true);
   }else resolve(false);
  });
 });
}

function vacancyPrefillFromGeocodeResult(result){
 if(!result)throw Error('EMPTY_GEOCODE_RESULT');
 const parts=result.address_components||[];
 const normalize=v=>String(v||'').normalize('NFKC').replace(/臺/g,'台').replace(/\s/g,'').trim();
 const part=(...types)=>{for(const t of types){const c=parts.find(x=>x.types?.includes(t));if(c?.long_name)return normalize(c.long_name)}return ''};
 let formatted=normalize(String(result.formatted_address||'')
   .replace(/^台灣(?:省)?\s*/,'')
   .replace(/^臺灣(?:省)?\s*/,'')
   .replace(/^\d{3,5}\s*/,''));
 if(!formatted){
  const route=part('route'),streetNo=part('street_number');
  formatted=[part('administrative_area_level_1','locality'),part('administrative_area_level_3','sublocality_level_1','sublocality'),route,streetNo].filter(Boolean).join('');
 }
 if(!formatted)throw Error('NO_POSTAL_ADDRESS');
 const cityNames=['台北市','新北市','桃園市','台中市','台南市','高雄市','基隆市','新竹市','嘉義市','新竹縣','苗栗縣','彰化縣','南投縣','雲林縣','嘉義縣','屏東縣','宜蘭縣','花蓮縣','台東縣','澎湖縣','金門縣','連江縣'];
 const componentCandidates=[
  part('administrative_area_level_1'),
  part('locality'),
  part('administrative_area_level_2')
 ].filter(Boolean);
 let city=cityNames.find(name=>componentCandidates.some(v=>v===name||v.includes(name)))||
   cityNames.find(name=>formatted.includes(name))||'';
 const districtCandidates=[
  part('administrative_area_level_3'),
  part('sublocality_level_1'),
  part('sublocality'),
  part('administrative_area_level_2'),
  part('locality')
 ].filter(Boolean);
 let district=districtCandidates.find(v=>/[區鄉鎮市]$/.test(v)&&v!==city&&!cityNames.includes(v))||'';
 if(!district&&city&&formatted.includes(city)){
  const rest=formatted.slice(formatted.indexOf(city)+city.length);
  district=(rest.match(/^(.{1,10}?(?:區|鄉|鎮|市))/)||[])[1]||'';
 }
 return {city:normalize(city),district:normalize(district),address:formatted};
}
async function reverseGeocodeVacancyPoint(point){
 if(!window.google?.maps?.Geocoder)throw Error('GEOCODER_NOT_READY');
 const coder=geocoder||new google.maps.Geocoder();
 const response=await coder.geocode({location:point,region:'TW'});
 const results=response?.results||[];
 if(!results.length)throw Error('ZERO_RESULTS');
 const ranked=[
  ...results.filter(x=>x.types?.includes('street_address')),
  ...results.filter(x=>x.types?.includes('premise')||x.types?.includes('subpremise')),
  ...results.filter(x=>x.types?.includes('route')),
  ...results
 ];
 let bestPrefill=null;
 for(const candidate of ranked){
  try{
   const parsed=vacancyPrefillFromGeocodeResult(candidate);
   if(parsed.city&&parsed.district&&parsed.address)return parsed;
   if(!bestPrefill||(!bestPrefill.city&&parsed.city)||(!bestPrefill.district&&parsed.district))bestPrefill=parsed;
  }catch(_){}
 }
 if(bestPrefill)return bestPrefill;
 throw Error('NO_POSTAL_ADDRESS');
}

  address.placeholder='請手動輸入正式地址';
  if(error)error.textContent=prefill.error;
  return;
 }

 const normalizedCity=String(prefill.city||'').replace(/臺/g,'台').trim();
 const normalizedDistrict=String(prefill.district||'').replace(/臺/g,'台').trim();
 if(normalizedCity&&[...city.options].some(o=>o.value===normalizedCity)){
  city.value=normalizedCity;

function normalizedStoreAddress(value){return String(value||'').normalize('NFKC').replace(/臺/g,'台').replace(/[\\s　,，、。．.\-－]/g,'').trim()}
function leadAddressCandidates(lead){return String(lead.storeAddress||'').split('；').map(x=>x.trim()).filter(Boolean)}
function matchVacancyByAddress(address){const key=normalizedStoreAddress(address);if(!key)return null;const found=vacancies.filter(v=>normalizedStoreAddress(v.address)===key);return found.length===1?found[0]:null}
function syncFranchiseVacancyLinks(){
 let changed=false;
 for(const v of vacancies){
  const matches=franchiseLeads.filter(lead=>leadAddressCandidates(lead).some(address=>normalizedStoreAddress(address)===normalizedStoreAddress(v.address)));
  if(matches.length===1){
   const lead=matches[0];
   if(!v.franchiseLeadId||String(v.franchiseLeadId)===String(v.autoMatchedLeadId||'')){
    if(String(v.franchiseLeadId||'')!==String(lead.id)||String(v.autoMatchedLeadId||'')!==String(lead.id)){v.franchiseLeadId=lead.id;v.autoMatchedLeadId=lead.id;changed=true}
   }
  }else if(v.autoMatchedLeadId&&String(v.franchiseLeadId||'')===String(v.autoMatchedLeadId)){
   v.franchiseLeadId='';delete v.autoMatchedLeadId;changed=true;
  }
 }
 if(changed){saveVacancies();refreshVacancyMarkers()}
 return changed;
}

async function importBackupJson(file){
 if(!file)return;
 try{
  if(file.size>20*1024*1024)throw Error('備份檔超過 20 MB，請確認檔案內容');
  const data=JSON.parse(await file.text());
  if(!data||data.format!=='comebuy-map-backup'||data.version!==1||!Array.isArray(data.vacancies)||!Array.isArray(data.franchiseLeads)||!data.storeOpeningDates||typeof data.storeOpeningDates!=='object'||Array.isArray(data.storeOpeningDates)||!data.storeEdits||typeof data.storeEdits!=='object'||Array.isArray(data.storeEdits))throw Error('JSON 格式不符合 COMEBUY MAP 備份 V1');
  if(data.vacancies.some(v=>!v||typeof v.id!=='string'||typeof v.address!=='string')||data.franchiseLeads.some(v=>!v||typeof v!=='object'||Array.isArray(v)))throw Error('備份內含不合法的空舖或加盟資料');
  if(!await confirmBackupImportStyled())return;
  const changes=[[VACANCY_KEY,data.vacancies],[FRANCHISE_KEY,data.franchiseLeads],[STORE_OPENING_KEY,data.storeOpeningDates],[STORE_EDITS_KEY,data.storeEdits]];
  const old=changes.map(([key])=>[key,localStorage.getItem(key)]);
  try{changes.forEach(([key,value])=>localStorage.setItem(key,JSON.stringify(value)))}catch(e){old.forEach(([key,value])=>{try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value)}catch(_) {}});throw Error('儲存空間不足或無法寫入，已嘗試還原原資料')}
  await showBackupImportSuccessStyled();
  location.reload();
 }catch(e){alert('匯入失敗：'+e.message)}
}

 if(entries.length>100)throw Error('單次最多匯入 100 筆空舖');
 const normalizeAddress=v=>String(v??'').normalize('NFKC').replace(/台/g,'臺').replace(/[\s,，、.。．.、\-－]/g,'').replace(/(?:臺灣省|臺灣|台灣|中華民國)/g,'').replace(/^(?:\d{3}|\d{5}|\d{6})/,'').toLowerCase();
 const knownCities=['臺北市','新北市','桃園市','臺中市','臺南市','高雄市','基隆市','新竹市','嘉義市','新竹縣','苗栗縣','彰化縣','南投縣','雲林縣','嘉義縣','屏東縣','宜蘭縣','花蓮縣','臺東縣','澎湖縣','金門縣','連江縣'];
 const stripCity=v=>{let x=normalizeAddress(v);for(const city of knownCities){const c=normalizeAddress(city);if(x.startsWith(c))return {city:c,rest:x.slice(c.length)}}return {city:'',rest:x}};
 const streetPart=v=>{let x=stripCity(v).rest;const m=x.match(/^(?:.{1,5}?[區鄉鎮市])(.+)$/);if(m)x=m[1];return x};
 const addressIdentity=(address,city='',district='')=>{
  const raw=normalizeAddress(address),c=normalizeAddress(city),d=normalizeAddress(district);
  const parsed=stripCity(raw);
  let street=parsed.rest;
  if(d&&street.startsWith(d))street=street.slice(d.length);
  else street=streetPart(street);
  return {city:parsed.city||c,street,raw};
 };
 const existing=vacancies.map(v=>addressIdentity(v.address,v.region?.city,v.region?.district));
 const seen=[];
 const isDuplicate=(candidate)=>[...existing,...seen].some(old=>{
  if(!candidate.street||!old.street)return candidate.raw===old.raw;
  if(candidate.city&&old.city&&candidate.city!==old.city)return false;
  return candidate.street===old.street||candidate.raw===old.raw;
 });
 const accepted=[],errors=[];let duplicateCount=0;
 for(let i=0;i<entries.length;i++){
  const row=entries[i],city=row['城市'],district=row['區域'],raw=row['空舖地址'];
  const rentText=row['月租金'].replace(/[,，元NT$\s]/g,''),rent=Number(rentText);
  if(!city||!district||!raw||!rentText||!Number.isFinite(rent)||rent<0){errors.push('第'+(headerIndex+i+2)+'列：缺少城市、區域、地址或有效租金');continue}
  const address=normalizeAddress(raw).startsWith(normalizeAddress(city))?raw:city+(normalizeAddress(raw).startsWith(normalizeAddress(district))?'':district)+raw;
  const key=addressIdentity(address,city,district);
  if(isDuplicate(key)){duplicateCount++;continue}
  seen.push(key);
  accepted.push({id:String(Date.now())+'-'+i+'-'+Math.random().toString(36).slice(2,7),address,rent,size:row['坪數'],front:row['面寬(公尺)'],contact:row['聯絡人'],phone:row['聯絡電話'],status:'vacant',position:null,region:{city,district},areaTypes:[],areaManual:true});
 }
 if(!accepted.length){const info=document.createElement('div');info.innerHTML='<p class="vacancy-import-summary">沒有需要新增的空舖資料</p>';const detail=document.createElement('p');detail.textContent='檔案：'+file.name+'｜已建檔或檔案內重複 '+duplicateCount+' 筆｜無效 '+errors.length+' 筆。既有資料不會重複建立。';info.appendChild(detail);if(errors.length){const p=document.createElement('p');p.className='vacancy-import-errors';p.textContent=errors.slice(0,8).join('；');info.appendChild(p)}await vacancyImportDialog('空舖資料比對結果',info,'完成',false);return;}
 const preview=vacancyImportPreview(accepted,errors);const comparison=document.createElement('p');comparison.className='vacancy-import-hint';comparison.textContent='檔案：'+file.name+'｜自動跳過重複 '+duplicateCount+' 筆。即使檔名相同，也只新增尚未建檔的地址。';preview.insertBefore(comparison,preview.firstChild);if(!await vacancyImportDialog('空舖資料匯入確認',preview,'確認並自動歸類'))return;
 const previous=vacancies;vacancies=[...accepted,...vacancies];
 if(!saveVacancies()){vacancies=previous;throw Error('本機儲存失敗，未完成匯入')}
 refreshVacancyMarkers();
 let located=0;
 for(const v of accepted){if(await geocodeVacancy(v))located++}
 showCaseManagement();
 const result=document.createElement('div');result.innerHTML='<p class="vacancy-import-summary">已成功建檔 '+accepted.length+' 筆</p><p>依城市、區域歸類完成。地圖定位成功 '+located+' 筆，待定位 '+(accepted.length-located)+' 筆；跳過重複 '+duplicateCount+' 筆。</p>';await vacancyImportDialog('空舖資料建檔完成',result,'完成',false);
}
function addVacancyDocActions(){

 generate.onclick=async()=>{generate.disabled=true;try{await generateVacancyXlsx()}catch(e){alert('產生 XLSX 失敗：'+e.message)}finally{generate.disabled=false}};
 const upload=document.createElement('button');upload.className='dashboard-backup';upload.textContent='匯入空舖資料表';
 const picker=document.createElement('input');picker.type='file';picker.accept='.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';picker.hidden=true;
 upload.onclick=()=>picker.click();
 picker.onchange=async()=>{if(!picker.files?.[0])return;upload.disabled=true;upload.textContent='匯入處理中…';try{await importVacancyXlsx(picker.files[0])}catch(e){alert('匯入失敗：'+e.message)}finally{upload.disabled=false;upload.textContent='匯入空舖資料表';picker.value=''}};
 const row=document.createElement('div');row.className='cb-settings-button-row';row.append(generate,upload);drawerBody.append(row,picker);
}
function showCaseManagement(){
 setDrawerLayout('dashboard');nav={level:'cases',city:null,district:null};drawer.classList.add('open');drawerTitle.textContent='項目';requestAnimationFrame(syncActionButtons);setGradientHeading('cases');backBtn.style.visibility='hidden';drawerBody.innerHTML='';
 const choices=document.createElement('div');choices.className='case-management-choices';
 choices.innerHTML='<button type="button" id="caseListEntry"><svg class="case-choice-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3.5h6M9 10h6M9 14h4M9 18l1.5 1.5 3-3"/></svg>加盟案件 <span>›</span></button><button type="button" id="ownerListEntry"><svg class="case-choice-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 20v-2a5.5 5.5 0 0 1 11 0v2M17 8h5M19.5 5.5v5M16 17h6"/></svg>加盟開發 <span>›</span></button>';
 drawerBody.appendChild(choices);
 choices.querySelector('#caseListEntry').onclick=()=>{franchisePanelMode='list';franchiseStageFilter='';showFranchise('cases')};
 choices.querySelector('#ownerListEntry').onclick=()=>{franchisePanelMode='existing';franchiseStageFilter='';showFranchise('owners')};
 const heading=document.createElement('h3');heading.textContent='開發概況';drawerBody.appendChild(heading);
 const d=new Date(),today=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),due=vacancies.filter(v=>v.followUpDate&&v.followUpDate<=today&&!['已開幕','放棄開發'].includes(v.developmentStage)),active=vacancies.filter(v=>!['已開幕','放棄開發'].includes(vacancyStage(v)));const cards=document.createElement('div');cards.className='dashboard-grid';[['開發中空舖',active.length],['加盟主名單',franchiseLeads.length],['未簽約',franchiseLeads.filter(v=>!['已簽約','受訓中'].includes(v.stage)).length],['已簽約',franchiseLeads.filter(v=>['已簽約','受訓中'].includes(v.stage)).length],['已簽約未付訂金',franchiseLeads.filter(v=>['已簽約','受訓中'].includes(v.stage)&&!v.depositReceived).length],['已簽約已付訂金',franchiseLeads.filter(v=>['已簽約','受訓中'].includes(v.stage)&&v.depositReceived).length],['今日及逾期待追蹤',due.length],['已簽約案件',vacancies.filter(v=>v.developmentStage==='已簽約').length]].forEach(([name,num])=>{const el=document.createElement('div');el.className='dashboard-card';el.innerHTML='<span>'+esc(name)+'</span><strong>'+num+'</strong>';cards.appendChild(el)});drawerBody.appendChild(cards);
 const h=document.createElement('h3');h.textContent='今日及逾期追蹤（'+due.length+'）';drawerBody.appendChild(h);due.sort((a,b)=>a.followUpDate.localeCompare(b.followUpDate)).forEach(v=>{const el=document.createElement('button');el.className='dashboard-follow';el.innerHTML='<strong>'+esc(v.address)+'</strong><span>'+esc(v.followUpDate)+'｜'+esc(vacancyStage(v))+'</span>';el.onclick=()=>{vacancyFilterCity='';vacancyFilterDistrict='';vacancyFilterStage='';showVacancies()};drawerBody.appendChild(el)})
}
function showSettings(){
 setDrawerLayout('compact');nav={level:'settings',city:null,district:null};drawer.classList.add('open');drawerTitle.textContent='設定';requestAnimationFrame(syncActionButtons);setGradientHeading('settings');backBtn.style.visibility='hidden';drawerBody.innerHTML='';
 const refreshBtn=document.createElement('button');refreshBtn.className='dashboard-backup';refreshBtn.textContent='↻ 頁面更新';refreshBtn.onclick=async()=>{refreshBtn.disabled=true;refreshBtn.textContent='檢查新版中…';try{const response=await fetch('/index.html?check='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const html=await response.text();if(!html.includes('function showCaseManagement()'))throw Error('頁面內容不完整');const url=new URL(location.href);url.searchParams.set('refresh',String(Date.now()));location.replace(url.toString())}catch(e){refreshBtn.disabled=false;refreshBtn.textContent='↻ 頁面更新';alert('更新失敗，請確認網路連線後重試')}};drawerBody.appendChild(refreshBtn);addVacancyDocActions();const btn=document.createElement('button');btn.className='dashboard-backup';btn.textContent='匯出備份（JSON）';btn.onclick=exportBackup;const backupRow=document.createElement('div');backupRow.className='cb-settings-button-row';backupRow.appendChild(btn);const backupImport=addBackupImportAction();backupRow.appendChild(backupImport.button);drawerBody.append(backupRow,backupImport.input);const note=document.createElement('p');note.className='vacancy-note';note.textContent='備份包含聯絡電話及照片，請妥善保管。資料目前僅存在本機。';drawerBody.appendChild(note);

// Main toolbar: tap a section to open; tap the same section again to close.
const mainToolbarSections=[
 ['openList',()=>!['vacancies','protection','cases','franchise','leads','lead','case','settings','dashboard'].includes(nav.level)],
 ['openVacancies',()=>nav.level==='vacancies'],

const actionButtons=[document.getElementById('openList'),document.getElementById('openVacancies'),document.getElementById('openProtection'),document.getElementById('openFranchise'),document.getElementById('openDashboard')];
