<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111c1b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="COMEBUY 地圖"><title>COMEBUY｜全台展店地圖</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#111c1b;color:#f5f7f7}#map{position:absolute;inset:0;z-index:0}.leaflet-container{background:#122220}.top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:800;padding:12px;pointer-events:none}.bar{pointer-events:auto;background:rgba(16,27,27,.96);border:1px solid #3c5550;box-shadow:0 5px 24px #0008;border-radius:18px;padding:12px;display:flex;gap:9px;align-items:center}.brand{font-weight:800;letter-spacing:.2px;white-space:nowrap}.brand b{color:#75dfb3}.count{font-size:11px;color:#a7bdb5}.action{background:#29413a;color:white;border:1px solid #547367;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.search{margin-top:9px;display:flex;gap:8px;pointer-events:auto}.search input,.search select{min-width:0;background:#152521;color:#fff;border:1px solid #4d6d60;border-radius:12px;padding:11px;font-size:15px}.search input{flex:1}.search select{max-width:125px}.status{pointer-events:auto;margin-top:8px;display:inline-block;background:#10221fdb;border:1px solid #426156;padding:7px 11px;border-radius:20px;font-size:12px;color:#d4e7dd}.bottom{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;right:12px;z-index:900;pointer-events:none}.panel{pointer-events:auto;height:19dvh;max-height:19dvh;overflow:hidden;background:#101b1bf5;border:1px solid #416257;border-radius:18px;box-shadow:0 10px 35px #000a;transition:height .25s ease,max-height .25s ease}.panel.expanded{height:58dvh;max-height:58dvh}.panel .list{height:calc(100% - 54px);overflow:auto;-webkit-overflow-scrolling:touch}.panelhead{position:sticky;top:0;background:#132521;padding:9px 12px;border-bottom:1px solid #355448;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px}.panelhead strong{font-size:14px}.list{padding:0 10px 6px}.item{width:100%;text-align:left;background:none;color:#e7f5ed;border:0;border-bottom:1px solid #30433e;padding:8px 4px;cursor:pointer}.item .name{font-weight:750;font-size:14px}.item .addr{font-size:11px;color:#a9c1b6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .meta{font-size:11px;color:#83e6b7;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-block;background:#344a40;padding:3px 7px;border-radius:7px;color:#d5e5dc;font-size:11px;margin-left:5px}.note{display:none;font-size:10px;color:#aac0b5;padding:7px 12px 10px}.panel.expanded .note{display:block}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#152722;color:#fff}.leaflet-popup-content{line-height:1.55}.leaflet-popup-content b{font-size:16px}.leaflet-popup-content small{color:#b7cfc2}.leaflet-popup-content a{color:#91eac4}.leaflet-control-zoom{margin-top:185px!important}.leaflet-control-attribution{font-size:9px!important}.marker{background:#66dba8;border:2px solid #0b3123;border-radius:50%;width:15px;height:15px;box-shadow:0 0 0 4px #6ce5b340}.loading{color:#b9d6c6}.hidden{display:none!important}@media(min-width:750px){.top{max-width:600px;left:18px;top:10px}.bottom{width:420px;left:18px;right:auto}.panel{height:24dvh;max-height:24dvh}.panel.expanded{height:60dvh;max-height:60dvh}}@media(max-width:380px){.brand{font-size:13px}.action{padding:8px}}
</style></head><body><div id="map"></div><div class="top"><div class="bar"><div style="flex:1"><div class="brand"><b>COMEBUY</b>｜全台展店地圖</div><div class="count"><span id="total"></span>筆門市資料 · 座標逐步核對</div></div><button class="action" id="home">全台</button><button class="action" id="toggle">清單</button></div><div class="search"><input id="q" placeholder="搜尋門市、地址或商圈"><select id="city"><option value="">全台縣市</option></select></div><div class="status" id="status">載入全台門市分布…</div></div><div class="bottom"><div class="panel" id="panel"><div class="panelhead"><strong id="paneltitle">門市清單</strong><button class="action" id="collapse">展開</button></div><div class="list" id="list"></div><div class="note">數字標記為縣市門市筆數，並非個別店址。租金為區域粗估，非實際租約；個別店址需點擊查詢定位。</div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="stores-1.js"></script><script src="stores-2.js"></script><script src="stores-3.js"></script><script src="stores-4.js"></script><script src="stores-5.js"></script><script src="stores-6.js"></script><script>
const stores=(window.STORE_CHUNKS||[]).flat();
const q=document.querySelector('#q'),city=document.querySelector('#city'),list=document.querySelector('#list'),panel=document.querySelector('#panel'),status=document.querySelector('#status');
document.querySelector('#total').textContent=stores.length;
const cityCounts={};stores.forEach(s=>cityCounts[s.city]=(cityCounts[s.city]||0)+1);Object.keys(cityCounts).sort().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c+' ('+cityCounts[c]+')';city.appendChild(o)});
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([23.75,120.85],7);L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);
const layer=L.layerGroup().addTo(map),markers=new Map();let cache={};try{cache=JSON.parse(localStorage.getItem('comebuy_geocodes_v2')||'{}')}catch(e){};
function clean(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function popup(s){return '<b>'+clean(s.name)+'</b><div>'+clean(s.address)+'</div><div>商圈：'+clean(s.district)+'</div><div>預估月租：'+clean(s.rent)+' 萬元</div><small>'+clean(s.basis)+'</small><p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address+' '+s.name)+'">在 Google 地圖核對位置</a></p>'}
function filtered(){const term=q.value.trim().toLowerCase();return stores.map((s,i)=>({...s,i})).filter(s=>(!city.value||s.city===city.value)&&(!term||[s.name,s.address,s.district].join(' ').toLowerCase().includes(term)))}
function add(i,p){if(markers.has(i)||!p||!Number.isFinite(+p.lat)||!Number.isFinite(+p.lon))return;let m=L.circleMarker([+p.lat,+p.lon],{radius:7,color:'#063a29',weight:2,fillColor:'#68e5ad',fillOpacity:.95}).bindPopup(popup(stores[i]));markers.set(i,m);if(filtered().some(s=>s.i===i))m.addTo(layer)}
function draw(){let arr=filtered();layer.clearLayers();arr.forEach(s=>{let m=markers.get(s.i);if(m)m.addTo(layer)});list.innerHTML='';arr.forEach(s=>{let btn=document.createElement('button');btn.className='item';let known=markers.has(s.i);btn.innerHTML='<div class="name">'+clean(s.name)+(s.status.includes('籌備')?'<span class="pill">籌備中</span>':'')+'</div><div class="addr">'+clean(s.address)+'</div><div class="meta">'+clean(s.district)+' · '+clean(s.rent)+'萬／月'+(known?' · 📍已定位':' · ⌕ 點擊查詢定位')+'</div>';btn.onclick=()=>selectStore(s.i);list.appendChild(btn)});document.querySelector('#paneltitle').textContent='門市清單 '+arr.length+' 筆';status.textContent='已定位 '+markers.size+' / '+stores.length+' 筆 · 可點選未定位門市查詢';}
async function geocode(i){let s=stores[i];if(markers.has(i))return true;status.textContent='正在查詢 '+s.name+' 的座標…';try{let url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tw&q='+encodeURIComponent(s.address.replaceAll('台','臺'));let r=await fetch(url,{headers:{'Accept-Language':'zh-TW'}});if(!r.ok)throw Error('HTTP '+r.status);let a=await r.json();if(a.length){let p={lat:Number(a[0].lat),lon:Number(a[0].lon)};if(p.lat>21.5&&p.lat<26.5&&p.lon>118&&p.lon<123){cache[s.address]=p;try{localStorage.setItem('comebuy_geocodes_v2',JSON.stringify(cache))}catch(e){}add(i,p);return true}}}catch(e){}return false}
async function selectStore(i){let s=stores[i];if(!markers.has(i)){let ok=await geocode(i);if(!ok){status.textContent='尚無可靠定位：'+s.name+'。請使用 Google 地圖核對。';window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address+' '+s.name),'_blank');return}}map.flyTo(markers.get(i).getLatLng(),16,{duration:.65});setTimeout(()=>markers.get(i).openPopup(),680);panel.classList.add('hidden');draw()}
function reset(){map.setView([23.75,120.85],7)}document.querySelector('#home').onclick=reset;document.querySelector('#toggle').onclick=()=>panel.classList.toggle('hidden');const collapseBtn=document.querySelector('#collapse');collapseBtn.onclick=()=>{panel.classList.toggle('expanded');collapseBtn.textContent=panel.classList.contains('expanded')?'縮小':'展開'};q.oninput=draw;city.onchange=()=>{draw();let points=filtered().map(s=>markers.get(s.i)?.getLatLng()).filter(Boolean);if(points.length)map.fitBounds(L.latLngBounds(points).pad(.25))};
Object.entries(cache).forEach(([addr,p])=>{let i=stores.findIndex(s=>s.address===addr);if(i>=0)add(i,p)});draw();
const cityCenters={'台北市':[25.0375,121.5637],'新北市':[25.012,121.465],'桃園市':[24.9937,121.301],'基隆市':[25.1276,121.739],'宜蘭縣':[24.757,121.753],'新竹市':[24.804,120.971],'新竹縣':[24.839,121.018],'苗栗縣':[24.56,120.82],'台中市':[24.1477,120.6736],'彰化縣':[24.075,120.542],'南投縣':[23.916,120.684],'雲林縣':[23.708,120.542],'嘉義市':[23.48,120.449],'嘉義縣':[23.46,120.29],'台南市':[22.9997,120.227],'高雄市':[22.6273,120.3014],'屏東縣':[22.676,120.494],'花蓮縣':[23.987,121.601],'台東縣':[22.758,121.144],'澎湖縣':[23.57,119.58],'金門縣':[24.43,118.32],'連江縣':[26.16,119.95]};
const summaryLayer=L.layerGroup().addTo(map);
function drawSummary(){summaryLayer.clearLayers();Object.entries(cityCounts).forEach(([c,n])=>{let center=cityCenters[c];if(!center||city.value&&city.value!==c)return;let label=L.divIcon({className:'',html:'<div style="background:#1d5445;border:2px solid #9af0c7;color:white;border-radius:24px;min-width:40px;padding:6px;text-align:center;font-weight:800;box-shadow:0 2px 9px #0009">'+n+'</div>',iconSize:[42,35],iconAnchor:[21,17]});L.marker(center,{icon:label}).addTo(summaryLayer).bindPopup('<b>'+clean(c)+'</b><div>門市資料 '+n+' 筆</div><small>此為縣市分布示意位置，非門市精確定位</small>');})}
const originalDraw=draw;draw=function(){originalDraw();drawSummary();status.textContent='縣市分布已顯示；精確定位 '+markers.size+' / '+stores.length+' 筆。點擊清單查詢個別門市。'};draw();
</script></body></html>
