(function(){

  function fit(){

  window.addEventListener('resize',fit);

})();

 let svg='<svg xmlns="http://www.w3.org/2000/svg" width="48" height="62" viewBox="0 0 48 62"><path d="M24 60 19 51h10Z" fill="#c91922" stroke="white" stroke-width="2"/><path d="M26 5 29 1h5" fill="none" stroke="#c91922" stroke-width="3" stroke-linecap="round"/><path d="M10 14h28l-3 35c-.2 3-3 5-6 5H19c-3 0-5.8-2-6-5Z" fill="#d71920" stroke="white" stroke-width="2.5" stroke-linejoin="round"/><rect x="8" y="11" width="32" height="6" rx="3" fill="#d71920" stroke="white" stroke-width="2"/><path d="M15 22h18" stroke="white" stroke-width="1.4" opacity=".7"/><text x="24" y="34" fill="white" font-family="Arial,sans-serif" font-size="7.1" font-weight="900" text-anchor="middle" letter-spacing="-.3">COMEBUY</text><path d="M18 39h12" stroke="white" stroke-width="1.3" stroke-linecap="round"/></svg>';

 return {url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),scaledSize:new google.maps.Size(38,49),anchor:new google.maps.Point(19,49)};

async function geocodeOne(s){
  if(markers.has(s.idx))return true;
  return new Promise(resolve=>{
    geocoder.geocode({address:s.address,region:'TW',componentRestrictions:{country:'TW'}},(results,status)=>{
      if(status==='OK'&&results&&results[0]){
        const loc=results[0].geometry.location;
        const p={lat:loc.lat(),lng:loc.lng()};
        cache[s.address]=p;saveCache();addMarker(s,p);updateStatus();resolve(true);
      }else if(status==='OVER_QUERY_LIMIT'){resolve('retry')}
      else resolve(false);
    })
  })
}
let running=false;
async function geocodeAll(){
  if(running)return;running=true;
  for(const s of stores){
    if(markers.has(s.idx))continue;
    let r=await geocodeOne(s);
    if(r==='retry'){await new Promise(res=>setTimeout(res,1400));r=await geocodeOne(s)}
    await new Promise(res=>setTimeout(res,280));
  }
  running=false;updateStatus();
}

function showDashboard(){setDrawerLayout('dashboard');nav={level:'dashboard',city:null,district:null};drawer.classList.add('open');drawerTitle.textContent='開發概況';backBtn.style.visibility='hidden';drawerBody.innerHTML='';const d=new Date(),today=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),due=vacancies.filter(v=>v.followUpDate&&v.followUpDate<=today&&!['已開幕','放棄開發'].includes(v.developmentStage)),active=vacancies.filter(v=>!['已開幕','放棄開發'].includes(v.developmentStage||'待評估'));const cards=document.createElement('div');cards.className='dashboard-grid';[['開發中空舖',active.length],['加盟主名單',franchiseLeads.length],['今日及逾期待追蹤',due.length],['已簽約案件',vacancies.filter(v=>v.developmentStage==='已簽約').length]].forEach(([name,num])=>{const el=document.createElement('div');el.className='dashboard-card';el.innerHTML='<span>'+esc(name)+'</span><strong>'+num+'</strong>';cards.appendChild(el)});drawerBody.appendChild(cards);const btn=document.createElement('button');btn.className='dashboard-backup';btn.textContent='匯出空舖與加盟主備份（JSON）';btn.onclick=exportBackup;drawerBody.appendChild(btn);const note=document.createElement('p');note.className='vacancy-note';note.textContent='備份包含聯絡電話及照片，請妥善保管。資料目前僅存在本機。';drawerBody.appendChild(note);const h=document.createElement('h3');h.textContent='今日及逾期追蹤（'+due.length+'）';drawerBody.appendChild(h);due.sort((a,b)=>a.followUpDate.localeCompare(b.followUpDate)).forEach(v=>{const el=document.createElement('button');el.className='dashboard-follow';el.innerHTML='<strong>'+esc(v.address)+'</strong><span>'+esc(v.followUpDate)+'｜'+esc(v.developmentStage||'待評估')+'</span>';el.onclick=()=>{vacancyFilterCity='';vacancyFilterDistrict='';vacancyFilterStage='';showVacancies()};drawerBody.appendChild(el)})}
document.getElementById('openDashboard').onclick=showDashboard;
function showProtection(){
 setDrawerLayout('protection');
 nav={level:'protection',city:null,district:null};
 drawer.classList.add('open');drawerTitle.textContent='門市保障範圍';backBtn.style.visibility='hidden';drawerBody.innerHTML='';
 const wrap=document.createElement('div');wrap.className='protection-panel';
 wrap.innerHTML='<label for="protectionDiameter">保障直徑（公尺）</label><select id="protectionDiameter"><option value="500">500 公尺</option><option value="1000">1,000 公尺</option><option value="1500">1,500 公尺</option><option value="2000">2,000 公尺</option><option value="3000">3,000 公尺</option></select><button id="protectionToggle" type="button" aria-pressed="'+String(protectionVisible)+'">'+(protectionVisible?'隱藏保障圈':'顯示保障圈')+'</button>';
 drawerBody.appendChild(wrap);
 diameterSelect=wrap.querySelector('#protectionDiameter');protectionToggle=wrap.querySelector('#protectionToggle');
 diameterSelect.value=String(protectionDiameterValue);
 diameterSelect.onchange=()=>{protectionDiameterValue=Number(diameterSelect.value);syncProtection()};
 protectionToggle.onclick=toggleProtection;
}
document.getElementById('openProtection').onclick=showProtection;
const actionButtons=[document.getElementById('openList'),document.getElementById('openVacancies'),document.getElementById('openProtection'),document.getElementById('openFranchise'),document.getElementById('openDashboard')];
function syncActionButtons(){
 const active=drawer.classList.contains('open')?(nav.level==='vacancies'?'openVacancies':nav.level==='protection'?'openProtection':nav.level==='franchise'?'openFranchise':nav.level==='dashboard'?'openDashboard':'openList'):null;
 actionButtons.forEach(btn=>{const on=btn.id===active;btn.classList.toggle('active',on);btn.setAttribute('aria-pressed',String(on))});
}
const drawerStateObserver=new MutationObserver(syncActionButtons);
drawerStateObserver.observe(drawer,{attributes:true,attributeFilter:['class']});
actionButtons.forEach(btn=>btn.addEventListener('click',syncActionButtons));
syncActionButtons();

showCities();
</script>
