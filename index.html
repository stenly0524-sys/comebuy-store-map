async function geocodeOne(s){
  if(markers.has(s.idx))return true;
  return new Promise(resolve=>{
    geocoder.geocode({address:s.address,region:'TW',componentRestrictions:{country:'TW'}},(results,status)=>{
      if(status==='OK'&&results&&results[0]){
        const loc=results[0].geometry.location;
        const p={lat:loc.lat(),lng:loc.lng()};
        cache[s.address]=p;saveCache();addMarker(s,p);updateStatus();resolve(true);
      }else if(status==='OVER_QUERY_LIMIT'){resolve('retry')}
      else resolve(false);
    })
  })
}
let running=false;
async function geocodeAll(){

    if(markers.has(s.idx))continue;

    if(r==='retry'){await new Promise(res=>setTimeout(res,1400));r=await geocodeOne(s)}

  }
  running=false;updateStatus();
}

 const names=new Set(stores.filter(x=>x.city===city).map(x=>x.districtName).filter(isDistrictName));
 for(const f of geo?.features||[]){

  const cityOK=entries.some(([k,v])=>/county|city|縣市|縣名|市名/i.test(k)&&boundaryName(v)===boundaryName(city));

 }
 return [...names].sort((x,y)=>x.localeCompare(y,'zh-Hant'));
}

function boundaryName(s){return String(s||'').replace(/臺/g,'台').replace(/\s/g,'')}
async function loadBoundary(level){
 if(!boundaryCache[level])boundaryCache[level]=fetch(BOUNDARY_URLS[level]).then(r=>{if(!r.ok)throw Error('boundary HTTP '+r.status);return r.json()}).catch(e=>{delete boundaryCache[level];throw e});

function boundaryMatch(feature,city,district){
 const p=feature.properties||{},entries=Object.entries(p).map(([k,v])=>[String(k).toLowerCase(),boundaryName(v)]);
 const match=(keys,value)=>entries.some(([k,v])=>keys.some(key=>k.includes(key))&&v===boundaryName(value));
 const cityKeys=['county','city','縣市','縣','市名'];
 const townKeys=['town','district','鄉鎮','區名','鄉名'];
 if(district){const cityOK=match(cityKeys,city)||entries.some(([k,v])=>k.includes('countyname')&&v===boundaryName(city));const districtOK=match(townKeys,district)||entries.some(([k,v])=>['name','名稱'].some(key=>k.includes(key))&&v===boundaryName(district));return cityOK&&districtOK;}
 return match(cityKeys,city)||entries.some(([k,v])=>['name','名稱'].some(key=>k.includes(key))&&v===boundaryName(city));
}
function focusBoundaryGeometry(geometry,bounds){
 if(!geometry)return;
 if(typeof geometry.forEachLatLng==='function')geometry.forEachLatLng(point=>bounds.extend(point));
 else if(typeof geometry.lat==='function'&&typeof geometry.lng==='function')bounds.extend(geometry);
 else if(typeof geometry.getArray==='function')geometry.getArray().forEach(item=>focusBoundaryGeometry(item,bounds));
}

function ringArea(ring){

async function fillVacancyMapAddress(point){
 const city=document.getElementById('vacancyCity'),district=document.getElementById('vacancyDistrict'),address=document.getElementById('vacancyAddress');
 if(!city||!district||!address||!geocoder)return;
 address.placeholder='正在判定地圖位置…';
 try{
  const result=await new Promise((resolve,reject)=>geocoder.geocode({location:point,language:'zh-TW'},(items,status)=>status==='OK'&&items&&items.length?resolve(items):reject(Error(status))));
  if(pendingVacancyMapPoint!==point||!document.contains(address))return;
  const best=result.find(x=>x.types.includes('street_address'))||result.find(x=>x.types.includes('premise'))||result[0];
  const normalize=v=>String(v||'').replace(/台/g,'臺').replace(/\s/g,'').trim();
  const components=result.flatMap(x=>x.address_components||[]);
  const typed=(types)=>{for(const t of types){const c=components.find(x=>x.types.includes(t));if(c)return c.long_name}return ''};
  const formatted=best.formatted_address||'';
  const cityCandidates=[typed(['administrative_area_level_1']),typed(['locality']),...components.map(x=>x.long_name)];
  const cityOption=[...city.options].find(o=>o.value&&cityCandidates.some(v=>normalize(v)===normalize(o.value)))||
    [...city.options].find(o=>o.value&&normalize(formatted).includes(normalize(o.value)));
  if(cityOption){
   city.value=cityOption.value;
   setLeadDistrictSelector(city,district);
   const districtCandidates=[typed(['administrative_area_level_3']),typed(['sublocality_level_1','sublocality_level_2']),...components.map(x=>x.long_name)];
   let districtOption=[...district.options].find(o=>o.value&&districtCandidates.some(v=>normalize(v)===normalize(o.value)));
   if(!districtOption){
    districtOption=[...district.options].find(o=>o.value&&normalize(formatted).includes(normalize(o.value)));
   }
   if(!districtOption){
    const named=districtCandidates.find(v=>/([區鄉鎮市])$/.test(v)&&normalize(v)!==normalize(city.value));

   }
   if(districtOption){district.disabled=false;district.value=districtOption.value;district.dispatchEvent(new Event('change',{bubbles:true}))}
  }

  const error=document.querySelector('.vacancy-form .vacancy-error');
  if(error)error.textContent=city.value&&district.value?'':'已填入地址，但無法完整判定城市或區域，請手動確認';

  address.placeholder='請核對地址與門牌';
 }catch(e){address.placeholder='無法自動取得地址，請手動輸入';const msg=document.querySelector('.vacancy-form .vacancy-error');if(msg)msg.textContent='無法判定完整地址，請手動選擇城市、區域及地址'}
}

async function importVacancyXlsx(file){
 if(!file||!file.name.toLowerCase().endsWith('.xlsx'))throw Error('請選擇 XLSX 格式的空舖資料表');
 if(file.size>10*1024*1024)throw Error('檔案不可超過 10MB');
 const XLSX=await loadVacancyXlsx(),wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});
 const sheet=wb.Sheets['空舖資料表']||wb.Sheets[wb.SheetNames[0]];
 if(!sheet)throw Error('檔案內找不到工作表');
 const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false,blankrows:false});
 const headerIndex=matrix.findIndex(row=>VACANCY_DOC_HEADERS.every(h=>row.map(x=>String(x).trim()).includes(h)));
 if(headerIndex<0)throw Error('找不到完整的八個欄位，請使用系統生成的 XLSX 範本');
 const header=matrix[headerIndex].map(x=>String(x).trim());
 const entries=matrix.slice(headerIndex+1).map(row=>Object.fromEntries(VACANCY_DOC_HEADERS.map(h=>[h,String(row[header.indexOf(h)]??'').trim()]))).filter(row=>Object.values(row).some(Boolean));
 if(!entries.length)throw Error('表格內沒有填寫空舖資料');
 if(entries.length>100)throw Error('單次最多匯入 100 筆空舖');
 const normalizeAddress=v=>String(v??'').normalize('NFKC').replace(/台/g,'臺').replace(/[\s,，、.。．.、\-－]/g,'').replace(/(?:臺灣省|臺灣|台灣|中華民國)/g,'').replace(/^(?:\d{3}|\d{5}|\d{6})/,'').toLowerCase();
 const knownCities=['臺北市','新北市','桃園市','臺中市','臺南市','高雄市','基隆市','新竹市','嘉義市','新竹縣','苗栗縣','彰化縣','南投縣','雲林縣','嘉義縣','屏東縣','宜蘭縣','花蓮縣','臺東縣','澎湖縣','金門縣','連江縣'];
 const stripCity=v=>{let x=normalizeAddress(v);for(const city of knownCities){const c=normalizeAddress(city);if(x.startsWith(c))return {city:c,rest:x.slice(c.length)}}return {city:'',rest:x}};
 const streetPart=v=>{let x=stripCity(v).rest;const m=x.match(/^(?:.{1,5}?[區鄉鎮市])(.+)$/);if(m)x=m[1];return x};
 const addressIdentity=(address,city='',district='')=>{
  const raw=normalizeAddress(address),c=normalizeAddress(city),d=normalizeAddress(district);
  const parsed=stripCity(raw);
  let street=parsed.rest;
  if(d&&street.startsWith(d))street=street.slice(d.length);
  else street=streetPart(street);
  return {city:parsed.city||c,street,raw};
 };
 const existing=vacancies.map(v=>addressIdentity(v.address,v.region?.city,v.region?.district));
 const seen=[];
 const isDuplicate=(candidate)=>[...existing,...seen].some(old=>{
  if(!candidate.street||!old.street)return candidate.raw===old.raw;
  if(candidate.city&&old.city&&candidate.city!==old.city)return false;
  return candidate.street===old.street||candidate.raw===old.raw;
 });
 const accepted=[],errors=[];let duplicateCount=0;
 for(let i=0;i<entries.length;i++){
  const row=entries[i],city=row['城市'],district=row['區域'],raw=row['空舖地址'];
  const rentText=row['月租金'].replace(/[,，元NT$\s]/g,''),rent=Number(rentText);
  if(!city||!district||!raw||!rentText||!Number.isFinite(rent)||rent<0){errors.push('第'+(headerIndex+i+2)+'列：缺少城市、區域、地址或有效租金');continue}
  const address=normalizeAddress(raw).startsWith(normalizeAddress(city))?raw:city+(normalizeAddress(raw).startsWith(normalizeAddress(district))?'':district)+raw;
  const key=addressIdentity(address,city,district);
  if(isDuplicate(key)){duplicateCount++;continue}
  seen.push(key);
  accepted.push({id:String(Date.now())+'-'+i+'-'+Math.random().toString(36).slice(2,7),address,rent,size:row['坪數'],front:row['面寬(公尺)'],contact:row['聯絡人'],phone:row['聯絡電話'],status:'vacant',position:null,region:{city,district},areaTypes:[],areaManual:true});
 }
 if(!accepted.length){const info=document.createElement('div');info.innerHTML='<p class="vacancy-import-summary">沒有需要新增的空舖資料</p>';const detail=document.createElement('p');detail.textContent='檔案：'+file.name+'｜已建檔或檔案內重複 '+duplicateCount+' 筆｜無效 '+errors.length+' 筆。既有資料不會重複建立。';info.appendChild(detail);if(errors.length){const p=document.createElement('p');p.className='vacancy-import-errors';p.textContent=errors.slice(0,8).join('；');info.appendChild(p)}await vacancyImportDialog('空舖資料比對結果',info,'完成',false);return;}
 const preview=vacancyImportPreview(accepted,errors);const comparison=document.createElement('p');comparison.className='vacancy-import-hint';comparison.textContent='檔案：'+file.name+'｜自動跳過重複 '+duplicateCount+' 筆。即使檔名相同，也只新增尚未建檔的地址。';preview.insertBefore(comparison,preview.firstChild);if(!await vacancyImportDialog('空舖資料匯入確認',preview,'確認並自動歸類'))return;
 const previous=vacancies;vacancies=[...accepted,...vacancies];
 if(!saveVacancies()){vacancies=previous;throw Error('本機儲存失敗，未完成匯入')}
 refreshVacancyMarkers();
 let located=0;
 for(const v of accepted){if(await geocodeVacancy(v))located++}
 showDashboard();
 const result=document.createElement('div');result.innerHTML='<p class="vacancy-import-summary">已成功建檔 '+accepted.length+' 筆</p><p>依城市、區域歸類完成。地圖定位成功 '+located+' 筆，待定位 '+(accepted.length-located)+' 筆；跳過重複 '+duplicateCount+' 筆。</p>';await vacancyImportDialog('空舖資料建檔完成',result,'完成',false);
}
function addVacancyDocActions(){
 const generate=document.createElement('button');generate.className='dashboard-backup';generate.style.marginBottom='9px';generate.textContent='生成空舖資料表（XLSX）';
 generate.onclick=async()=>{generate.disabled=true;try{await generateVacancyXlsx()}catch(e){alert('產生 XLSX 失敗：'+e.message)}finally{generate.disabled=false}};

 const upload=document.createElement('button');upload.className='dashboard-backup';upload.style.marginBottom='9px';upload.textContent='上傳空舖資料';
 const picker=document.createElement('input');picker.type='file';picker.accept='.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';picker.hidden=true;
 upload.onclick=()=>picker.click();
 picker.onchange=async()=>{if(!picker.files?.[0])return;upload.disabled=true;upload.textContent='匯入處理中…';try{await importVacancyXlsx(picker.files[0])}catch(e){alert('匯入失敗：'+e.message)}finally{upload.disabled=false;upload.textContent='上傳空舖資料';picker.value=''}};
 drawerBody.append(upload,picker);
}
function showDashboard(){setDrawerLayout('dashboard');nav={level:'dashboard',city:null,district:null};drawer.classList.add('open');drawerTitle.textContent='開發概況';backBtn.style.visibility='hidden';drawerBody.innerHTML='';const d=new Date(),today=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),due=vacancies.filter(v=>v.followUpDate&&v.followUpDate<=today&&!['已開幕','放棄開發'].includes(v.developmentStage)),active=vacancies.filter(v=>!['已開幕','放棄開發'].includes(vacancyStage(v)));const cards=document.createElement('div');cards.className='dashboard-grid';[['開發中空舖',active.length],['加盟主名單',franchiseLeads.length],['未簽約',franchiseLeads.filter(v=>!['已簽約','受訓中'].includes(v.stage)).length],['已簽約',franchiseLeads.filter(v=>['已簽約','受訓中'].includes(v.stage)).length],['已簽約未付訂金',franchiseLeads.filter(v=>['已簽約','受訓中'].includes(v.stage)&&!v.depositReceived).length],['已簽約已付訂金',franchiseLeads.filter(v=>['已簽約','受訓中'].includes(v.stage)&&v.depositReceived).length],['今日及逾期待追蹤',due.length],['已簽約案件',vacancies.filter(v=>v.developmentStage==='已簽約').length]].forEach(([name,num])=>{const el=document.createElement('div');el.className='dashboard-card';el.innerHTML='<span>'+esc(name)+'</span><strong>'+num+'</strong>';cards.appendChild(el)});drawerBody.appendChild(cards);const refreshBtn=document.createElement('button');refreshBtn.className='dashboard-backup';refreshBtn.style.marginBottom='9px';refreshBtn.textContent='↻ 頁面更新';refreshBtn.onclick=async()=>{refreshBtn.disabled=true;refreshBtn.textContent='檢查新版中…';try{const response=await fetch('/index.html?check='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const html=await response.text();if(!html.includes('function showDashboard()'))throw Error('頁面內容不完整');const url=new URL(location.href);url.searchParams.set('refresh',String(Date.now()));location.replace(url.toString())}catch(e){refreshBtn.disabled=false;refreshBtn.textContent='↻ 頁面更新';alert('更新失敗，請確認網路連線後重試')}};drawerBody.appendChild(refreshBtn);addVacancyDocActions();const btn=document.createElement('button');btn.className='dashboard-backup';btn.textContent='匯出空舖與加盟主備份（JSON）';btn.onclick=exportBackup;drawerBody.appendChild(btn);const note=document.createElement('p');note.className='vacancy-note';note.textContent='備份包含聯絡電話及照片，請妥善保管。資料目前僅存在本機。';drawerBody.appendChild(note);const h=document.createElement('h3');h.textContent='今日及逾期追蹤（'+due.length+'）';drawerBody.appendChild(h);due.sort((a,b)=>a.followUpDate.localeCompare(b.followUpDate)).forEach(v=>{const el=document.createElement('button');el.className='dashboard-follow';el.innerHTML='<strong>'+esc(v.address)+'</strong><span>'+esc(v.followUpDate)+'｜'+esc(vacancyStage(v))+'</span>';el.onclick=()=>{vacancyFilterCity='';vacancyFilterDistrict='';vacancyFilterStage='';showVacancies()};drawerBody.appendChild(el)})}
document.getElementById('openDashboard').onclick=showDashboard;
