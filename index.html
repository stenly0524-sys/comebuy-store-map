(function(){

  // Avoid screen.height, which is in a different coordinate system on iOS.
  function fit(){
    const h=window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight;
    const el=document.getElementById('map');
    if(el && h>0){el.style.height=Math.ceil(h)+'px';if(window.google?.maps && window.__comebuyMap)google.maps.event.trigger(window.__comebuyMap,'resize');}
  }
  window.addEventListener('resize',fit);
  window.visualViewport?.addEventListener('resize',fit);
  window.addEventListener('orientationchange',fit);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)fit()});
  fit();
})();

async function geocodeOne(s){
  if(markers.has(s.idx))return true;
  return new Promise(resolve=>{
    geocoder.geocode({address:s.address,region:'TW',componentRestrictions:{country:'TW'}},(results,status)=>{
      if(status==='OK'&&results&&results[0]){
        const loc=results[0].geometry.location;
        const p={lat:loc.lat(),lng:loc.lng()};
        cache[s.address]=p;saveCache();addMarker(s,p);updateStatus();resolve(true);
      }else if(status==='OVER_QUERY_LIMIT'){resolve('retry')}
      else resolve(false);
    })
  })
}
let running=false;
async function geocodeAll(){
  if(running)return;running=true;
  for(const s of stores){
    if(markers.has(s.idx))continue;
    let r=await geocodeOne(s);
    if(r==='retry'){await new Promise(res=>setTimeout(res,1400));r=await geocodeOne(s)}
    await new Promise(res=>setTimeout(res,280));
  }
  running=false;updateStatus();
}

const AREA_TYPES=['待調查','住宅生活型','辦公商務型','商業購物型','學區校園型','交通轉運型','觀光休閒型','工業園區型','複合混合型'];
async function detectAreaType(v,force=false){
 if(!v.position)return false;
 if(!force&&v.areaAnalysis?.date&&Date.now()-v.areaAnalysis.date<30*86400000)return true;
 const {lat,lng}=v.position;
 if(!Number.isFinite(lat)||!Number.isFinite(lng))return false;
 const query='[out:json][timeout:20];(nwr(around:500,'+lat+','+lng+')['+'"amenity"'+'];nwr(around:500,'+lat+','+lng+')['+'"shop"'+'];nwr(around:500,'+lat+','+lng+')['+'"office"'+'];nwr(around:500,'+lat+','+lng+')['+'"tourism"'+'];nwr(around:500,'+lat+','+lng+')['+'"landuse"'+'];nwr(around:500,'+lat+','+lng+')['+'"railway"'+'];);out tags;';
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),14000);
 try{
  const response=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:query}),signal:controller.signal});
  if(!response.ok)throw Error('OSM HTTP '+response.status);
  const data=await response.json();
  const counts=Object.fromEntries(AREA_TYPES.slice(1).map(k=>[k,0]));
  const seen=new Set();
  for(const element of data.elements||[]){
   const key=element.type+':'+element.id;if(seen.has(key))continue;seen.add(key);
   const t=element.tags||{},a=t.amenity||'',shop=t.shop||'',land=t.landuse||'';
   if(['school','college','university','kindergarten','language_school'].includes(a))counts['學區校園型']+=3;
   if(t.office||['commercial'].includes(land))counts['辦公商務型']+=2;
   if(shop||['marketplace','restaurant','cafe','fast_food','food_court'].includes(a))counts['商業購物型']+=1;
   if(['residential'].includes(land)||t.building==='apartments'||t.building==='residential')counts['住宅生活型']+=2;
   if(['station','subway_entrance','tram_stop','halt'].includes(t.railway)||['bus_station','ferry_terminal'].includes(a))counts['交通轉運型']+=3;
   if(t.tourism||['museum','arts_centre','theatre'].includes(a))counts['觀光休閒型']+=2;
   if(['industrial'].includes(land)||t.building==='industrial')counts['工業園區型']+=3;
  }
  const ranked=Object.entries(counts).filter(([k,n])=>n>0).sort((a,b)=>b[1]-a[1]);
  const primary=ranked[0];
  // Sparse OSM tags must not be interpreted as proof of a residential or commercial district.
  const suggestion=primary&&primary[1]>=3?primary[0]:'待調查';
  v.areaAnalysis={source:'OpenStreetMap / Overpass',radiusMeters:500,date:Date.now(),counts,featureCount:seen.size,suggestion,confidence:'僅供初篩，需人工確認'};
  if(!v.areaManual)v.areaType=suggestion;
  saveVacancies();return true;
 }catch(err){
  v.areaAnalysis={source:'OpenStreetMap / Overpass',date:Date.now(),error:'公開查詢服務暫時無法使用'};
  saveVacancies();return false;
 }finally{clearTimeout(timer)}
}
function geocodeVacancy(v){
 return new Promise(resolve=>{
  if(!geocoder){resolve(false);return}
  geocoder.geocode({address:v.address,region:'TW',componentRestrictions:{country:'TW'}},(results,status)=>{
   if(status==='OK'&&results?.[0]){
    const loc=results[0].geometry.location;
    v.position={lat:loc.lat(),lng:loc.lng()};
    const parts=results[0].address_components||[];
    const part=t=>parts.find(c=>c.types?.includes(t))?.long_name||'';
    v.region={city:part('administrative_area_level_1')||part('administrative_area_level_2'),district:part('administrative_area_level_3')||part('sublocality_level_1')||part('sublocality'),neighborhood:part('neighborhood')};
    v.areaType='待調查';
    saveVacancies();refreshVacancyMarkers();resolve(true);
   }else resolve(false);
  });
 });
}

 wrap.innerHTML='<label for="protectionDiameter">保障直徑（公尺）</label><select id="protectionDiameter"><option value="500">500 公尺</option><option value="1000">1,000 公尺</option><option value="1500">1,500 公尺</option><option value="2000">2,000 公尺</option><option value="3000">3,000 公尺</option></select><button id="protectionToggle" type="button" aria-pressed="'+String(protectionVisible)+'">'+(protectionVisible?'隱藏保障圈':'顯示保障圈')+'</button>';
 drawerBody.appendChild(wrap);
 diameterSelect=wrap.querySelector('#protectionDiameter');protectionToggle=wrap.querySelector('#protectionToggle');
 diameterSelect.value=String(protectionDiameterValue);
 diameterSelect.onchange=()=>{protectionDiameterValue=Number(diameterSelect.value);syncProtection()};
 protectionToggle.onclick=toggleProtection;
}
document.getElementById('openProtection').onclick=showProtection;
const actionButtons=[document.getElementById('openList'),document.getElementById('openVacancies'),document.getElementById('openProtection')];
function syncActionButtons(){
 const active=drawer.classList.contains('open')?(nav.level==='vacancies'?'openVacancies':nav.level==='protection'?'openProtection':'openList'):null;
 actionButtons.forEach(btn=>{const on=btn.id===active;btn.classList.toggle('active',on);btn.setAttribute('aria-pressed',String(on))});
}
const drawerStateObserver=new MutationObserver(syncActionButtons);
drawerStateObserver.observe(drawer,{attributes:true,attributeFilter:['class']});
actionButtons.forEach(btn=>btn.addEventListener('click',syncActionButtons));
syncActionButtons();

showCities();
