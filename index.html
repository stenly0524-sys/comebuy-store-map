getZoom()\u003c16)map.setZoom(17);\n map.panTo(position);\n}\nfunction gpsUpdate(position){\n if(!map)return;\n const point={lat:position.coords.latitude,lng:position.coords.longitude};\n const accuracy=Math.max(0,Number(position.coords.accuracy)||0);\n if(!Number.isFinite(point.lat)||!Number.isFinite(point.lng))return;\n const firstFix=!gpsPosition;\n gpsPosition=point;\n if(!gpsMarker){\n  gpsMarker=new google.maps.Marker({map,position:point,title:'我的即時位置',\n   icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:'#2563eb',fillOpacity:1,strokeColor:'#ffffff',strokeWeight:3},zIndex:9999});\n  gpsAccuracyCircle=new google.maps.Circle({map,center:point,radius:accuracy,strokeColor:'#2563eb',strokeOpacity:.35,strokeWeight:1,fillColor:'#2563eb',fillOpacity:.12,clickable:false});\n }else{\n  gpsMarker.setPosition(point);\n  gpsAccuracyCircle.setCenter(point);\n  gpsAccuracyCircle.setRadius(accuracy);\n }\n if(firstFix&&gpsFollow){gpsCenter(point,true);gpsFollow=false;gpsUi('paused','點擊定位至目前位置');}\n}\nfunction gpsError(error){\n const reason=error?.code===1?'定位權限遭拒絕，請在 iPhone 設定允許此網站使用位置。':error?.code===2?'目前無法取得 GPS 位置，請確認定位服務與訊號。':'GPS 定位逾時，請再試一次。';\n if(error?.code===1){if(gpsWatchId!==null)navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;gpsFollow=false;gpsUi('off','開始 GPS 即時定位')}\n else if(gpsWatchId!==null)gpsUi(gpsFollow?'following':'paused','GPS 定位中，點擊恢復跟隨');\n alert(reason);\n}\ngpsButton.addEventListener('click',()=>{\n if(!map)return;\n if(!navigator.geolocation){alert('此瀏覽器不支援 GPS 定位。');return}\n if(gpsWatchId===null){\n  gpsFollow=true;\n  gpsUi('following','正在取得 GPS 位置');\n  gpsWatchId=navigator.geolocation.watchPosition(gpsUpdate,gpsError,{enableHighAccuracy:true,maximumAge:2000,timeout:15000});\n }else{\n  gpsFollow=false;\n  gpsUi('paused','點擊定位至目前位置');\n  if(gpsPosition)gpsCenter(gpsPosition);\n }\n});\n// Headquarters is a dedicated map landmark, not a store or vacancy record.\nconst CB_HQ_ADDRESS='台北市中正區博愛路53號';\nconst CB_HQ_CACHE_KEY='cb_maps_headquarters_coordinate_v1';\nlet cbHqMarker=null,cbHqPosition=null,cbHqGeocodePromise=null;\nfunction cbHeadquartersIcon(){\n const svg='\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"54\" height=\"64\" viewBox=\"0 0 54 64\">\u003cpath d=\"M27 2C13 2 2 13 2 27c0 17 25 35 25 35s25-18 25-35C52 13 41 2 27 2Z\" fill=\"#b80e1b\" stroke=\"#fff\" stroke-width=\"3\"/>\u003cpath d=\"M16 20h22v25H16z\" fill=\"#fff\" rx=\"1\"/>\u003cpath d=\"M21 16h12v4H21z\" fill=\"#fff\"/>\u003cpath d=\"M22 25h3v4h-3zm7 0h3v4h-3zm-7 7h3v4h-3zm7 0h3v4h-3z\" fill=\"#b80e1b\"/>\u003cpath d=\"M25 38h4v7h-4z\" fill=\"#b80e1b\"/>\u003c/svg>';\n return {url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),scaledSize:new google.maps.Size(43,51),anchor:new google.maps.Point(21.5,51)};\n}\nfunction cbHeadquartersPopup(){\n const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(CB_HQ_ADDRESS);\n return '\u003cdiv class=\"cb-map-store-card\" data-cb-headquarters-popup=\"true\" style=\"min-width:220px;max-width:280px\">\u003cb style=\"font-size:20px;line-height:1.35\">COMEBUY 總公司\u003c/b>\u003cdiv style=\"margin-top:5px\">'+esc(CB_HQ_ADDRESS)+'\u003c/div>\u003cdiv style=\"margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:7px\">\u003ca href=\"'+esc(url)+'\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:block;text-align:center;padding:10px 6px;background:#fff;color:#d71920;border:1px solid #d71920;text-decoration:none;border-radius:9px;font-weight:700;font-size:13px\">Google maps\u003c/a>\u003c/div>\u003c/div>';\n}\nfunction cbEnsureHeadquartersMarker(position){\n if(!map||!position)return;\n cbHqPosition=position;\n if(!cbHqMarker){\n  cbHqMarker=new google.maps.Marker({map,position,title:'COMEBUY 總公司｜'+CB_HQ_ADDRESS,icon:cbHeadquartersIcon(),zIndex:900});\n  cbHqMarker.addListener('click',()=>{\n   if(!infoWindow)infoWindow=new google.maps.InfoWindow();\n   infoWindow.close();google.maps.event.addListenerOnce(infoWi pup){card=null;action.style.display='none';return}\n  card=next;\n  const rect=card.getBoundingClientRect();\n  const x=Math.max(12,Math.min(innerWidth-170,rect.left+rect.width/2-75));\n  const y=rect.bottom+8\u003cinnerHeight-70?rect.bottom+8:Math.max(110,rect.top-52);\n  action.style.left=x+'px';action.style.top=y+'px';action.style.display='block';\n  cardText=card.innerText||card.textContent||'';\n };\n action.onclick=async evt=>{\n  evt.preventDefault();evt.stopPropagation();\n  if(busy)return;\n  busy=true;action.disabled=true;action.textContent='正在取得地址…';\n  try{\n   // The visible Google POI card is authoritative for the street number.\n   // Never replace it with a geocoded nearby building or a stale previous POI.\n   // Google POI cards may split the address across nested elements or return\n   // a short innerText; inspect visible descendants and preserve the displayed house number.\n   const rawText=String(card?.innerText||card?.textContent||cardText||'').replace(/\\u00a0/g,' ').replace(/臺/g,'台');\n   const cardCandidates=[\n    rawText,cardText,\n    ...Array.from(card?.querySelectorAll('*')||[]).flatMap(el=>[el.innerText,el.textContent,el.getAttribute('aria-label'),el.getAttribute('title')])\n   ].map(x=>String(x||'').replace(/\\u00a0/g,' ').replace(/臺/g,'台').trim()).filter(Boolean);\n   const lines=cardCandidates.flatMap(x=>x.split(/\\n+/)).map(x=>x.trim()).filter(Boolean);\n   const streetPattern=/(?:路|街|大道|巷|弄|段).{0,80}\\d+(?:之\\d+|-\\d+)?號/;\n   // Prefer the address line displayed on the actual Google POI card.\n   const rawAddress=lines.find(x=>streetPattern.test(x))\n     ||lines.find(x=>/(?:路|街|大道|巷|弄|段).{0,80}\\d+(?:之\\d+|-\\d+)?號/.test(x.replace(/\\s/g,'')))\n     ||'';\n   let address=rawAddress.replace(/^\\s*\\d{3,5}\\s*/,'').replace(/^台灣(?:省)?/,'').replace(/\\s/g,'').trim();\n   const hasExactStreet=streetPattern.test(address);\n   const cityNames=['台北市','新北市','桃園市','台中市','台南市','高雄市','基隆市','新竹市','嘉義市','新竹縣','苗栗縣','彰化縣','南投縣','雲林縣','嘉義縣','屏東 const execute=()=>{try{const q=input.value.trim().replace(/臺/g,'台');if(!q)return;const api=window.ComebuyLocalAssistant;if(!api)throw Error('系統資料尚未載入');if(/新增|建立|刪除|修改|恢復|封存|標記|覆蓋|還原|搜尋|試算|評分|合約|開幕|工程|PDF|Word|Excel|XLSX/i.test(q))throw Error('此操作尚未接入本機助理，未變更任何資料。');if(/備份/.test(q)){throw Error('完整備份尚待核對涵蓋範圍，請使用原設定頁備份。')}let rows,kind;if(/歷史|完成的工作|已完成/.test(q)){kind='歷史工作';rows=history();if(/今天|今日/.test(q))rows=rows.filter(t=>String(t.日期).slice(0,10)===today())}else if(/任務|工作|待辦|逾期/.test(q)){kind='工作待辦';rows=tasks().filter(t=>!t.archived&&!t.done&&!(t.類型==='everyday'&&t.completed?.[today()]));if(/逾期/.test(q))rows=rows.filter(t=>t.類型==='routine'&&t.date&&t.date<today());else if(/今天|今日/.test(q))rows=rows.filter(t=>t.類型==='routine'&&t.date===today()||t.類型==='everyday');rows=rows.map(t=>({任務:t.title,日期:t.date||'',備註:t.note||'',類型:t.類型}))}else if(/空舖|空鋪|店面/.test(q)){kind='空舖';rows=api.vacancies();if(/待評估/.test(q))rows=rows.filter(t=>t.狀態==='待評估');const m=q.match(/租金\s*(\d+(?:\.\d+)?)\s*(萬)?\s*(?:元)?(?:以下|以內)/);if(m){const max=Number(m[1])*(m[2]?10000:1);rows=rows.filter(t=>t.租金!==''&&t.租金!=null&&Number(String(t.租金).replace(/,/g,''))<=max)}else if(/租金.*(?:以下|以內|低於|高於)/.test(q))throw Error('請以阿拉伯數字指定租金，例如 8萬以下。');if(/租金排序|按照租金|依租金/.test(q))rows.sort((a,b)=>Number(a.租金)-Number(b.租金))}else if(/加盟開發|加盟主/.test(q)){kind='加盟開發';rows=api.leads()}else if(/門市|門店|分店/.test(q)){kind='門市';rows=api.stores()}else throw Error('未辨識此指令，請指定門市、空舖、加盟開發或工作待辦。');const cities=['台北市','新北市','基隆市','桃園市','新竹市','新竹縣','苗栗縣','台中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','台南市','高雄市','屏東縣','宜蘭縣','花蓮縣','台東縣','澎湖縣','金門縣','連江縣'];const city=cities.find(c=>q.includes(c)||q.includes(c.slice(0,-1)));if(city)rows=rows.filter(t=>t.城市===city);out.textContent=kind+'｜'+rows.length+' 筆（本機資料）\n'+rows.slice(0,50).map(t=>Object.entries(t).filter(x=>x[1]!=null&&x[1]!=='').map(([k,v])=>k+'：'+v).join('｜')).join('\n');if(rows.length>50)out.textContent+='\n僅顯示前50筆，匯出包含全部。';if(/匯出|下載/.test(q)){const json=/JSON/i.test(q),keys=[...new Set
