<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="COMEBUY Map">
<link rel="icon" type="image/svg+xml" href="/comebuy-map-icon.svg?v=2">
<link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png?v=5">
<title>COMEBUY｜全台展店地圖</title>
<style>
:root{--red:#d71920;--red2:#ef3d43;--ink:#211d1d;--paper:#fff;--line:#ebe5e1;--soft:#f8f6f4;--muted:#766e69}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:#8ad5e6;color:var(--ink)}
#map{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#8ad5e6}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:20;pointer-events:none}
.card{pointer-events:auto;background:rgba(255,255,255,.97);border:1px solid #eee7e2;border-radius:22px;box-shadow:0 8px 28px #0002;padding:12px}
.row{display:flex;align-items:center;gap:10px}
.logo{width:136px;height:auto;display:block}
.copy{flex:1;min-width:0}.title{font-size:14px;font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.brandline{height:4px;width:72px;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--red2));margin-top:5px}
.btn{border:0;border-radius:13px;background:var(--red);color:#fff;padding:10px 13px;font-weight:900;font-size:13px}
.tools{display:flex;gap:8px;margin-top:10px}
.tools input,.tools select{height:43px;background:#fff;border:1px solid #ded7d2;border-radius:13px;padding:0 12px;font-size:14px;color:var(--ink)}
.tools input{flex:1;min-width:0}.tools select{width:132px}
.status{pointer-events:auto;margin-top:8px;display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #e9e1dc;border-radius:999px;padding:7px 11px;font-size:11px;color:#5d5652;box-shadow:0 4px 18px #0001}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #d7192020}
.drawer{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:60vh;height:60svh;max-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 20px);z-index:30;background:#fff;border-radius:24px;box-shadow:0 14px 50px #0005;border:1px solid #eee6de;overflow:hidden;display:flex;flex-direction:column;visibility:hidden;pointer-events:none;transform:translateY(calc(100% + 40px));transition:transform .26s ease,visibility 0s linear .26s}
.drawer.open{transform:translateY(0);visibility:visible;pointer-events:auto;transition:transform .26s ease,visibility 0s}
.drawerhead{flex:0 0 58px;min-height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:9px 12px}
.drawerhead strong{flex:1;font-size:16px}
.back,.close{width:38px;height:38px;border-radius:12px;font-size:19px}
.back{border:1px solid #e1d9d2;background:#fff}.close{border:0;background:var(--red);color:#fff}
.drawerbody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 18px}
.menurow{width:100%;border:0;background:#fff;border-bottom:1px solid var(--line);padding:13px 8px;text-align:left;display:flex;align-items:center;gap:10px}
.rowmain{flex:1;min-width:0}.rowtitle{font-weight:900;font-size:15px}.rowsub{margin-top:3px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{min-width:34px;padding:5px 8px;border-radius:999px;background:#f3eeea;text-align:center;font-weight:900;font-size:12px}.chev{font-size:22px;color:#9d948e}
.storecard{padding:14px;border:1px solid #e8e0da;border-radius:18px;background:var(--soft);margin:5px 2px}
.storecard h2{font-size:20px;margin:0 0 8px}.kv{font-size:13px;line-height:1.7;color:#504945}.actions{display:flex;gap:8px;margin-top:12px}
.actions button,.actions a{flex:1;text-align:center;text-decoration:none;border-radius:13px;padding:11px;font-weight:900;font-size:13px}
.primary{background:var(--red);color:#fff;border:0}.secondary{background:#fff;color:var(--ink);border:1px solid #ddd4ce}
@media(min-width:760px){.top{max-width:660px;left:18px}.drawer{width:430px;right:auto;left:18px}}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="card">
    <div class="row">
      <img class="logo" src="https://www.comebuy2002.com.tw/images/logo.png" alt="COMEBUY">
      <div class="copy">
        <div class="title">全台展店地圖</div>
        <div class="sub"><span id="total">0</span> 間門市 · Google Maps</div>
        <div class="brandline"></div>
      </div>
      <button class="btn" id="openList">清單</button>
    </div>
    <div class="tools">
      <input id="q" placeholder="搜尋門市、地址或區域">
      <select id="citySelect"></select>
    </div>
  </div>
  <div class="status"><span class="dot"></span><span id="status">正在載入 Google Maps…</span></div>
  <button id="activityToggle" type="button" style="pointer-events:auto;display:block;margin-top:8px;background:#d71920;color:white;border:0;border-radius:12px;padding:11px 15px;font-size:14px;font-weight:800;box-shadow:0 3px 12px #0002">商圈活躍度</button>
  <div id="activityInfo" style="pointer-events:auto;display:inline-block;margin-top:5px;padding:6px 9px;background:white;border-radius:9px;font-size:11px">代理指標｜非實測人流</div>
</div>

<div class="drawer" id="drawer">
  <div class="drawerhead">
    <button class="back" id="backBtn">‹</button>
    <strong id="drawerTitle">城市</strong>
    <button class="close" id="closeBtn">×</button>
  </div>
  <div class="drawerbody" id="drawerBody"></div>
</div>

<script>
(function(){
  // Standalone iOS: keep the map aligned with the actual layout viewport.
  // Avoid screen.height, which is in a different coordinate system on iOS.
  function fit(){
    const h=window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight;
    const el=document.getElementById('map');
    if(el && h>0){el.style.height=Math.ceil(h)+'px';if(window.google?.maps && window.__comebuyMap)google.maps.event.trigger(window.__comebuyMap,'resize');}
  }
  window.addEventListener('resize',fit);
  window.visualViewport?.addEventListener('resize',fit);
  window.addEventListener('orientationchange',fit);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)fit()});
  fit();
})();
</script>
<script src="stores-1.js"></script>
<script src="stores-2.js"></script>
<script src="stores-3.js"></script>
<script src="stores-4.js"></script>
<script src="stores-5.js"></script>
<script src="stores-6.js"></script>
<script>
const raw=(window.STORE_CHUNKS||[]).flat();
const CITY_ORDER=["基隆市","台北市","新北市","桃園市","新竹市","新竹縣","苗栗縣","台中市","彰化縣","南投縣","雲林縣","嘉義市","嘉義縣","台南市","高雄市","屏東縣","宜蘭縣","花蓮縣","台東縣","澎湖縣","金門縣","連江縣"];
const CITY_CENTERS={
"基隆市":[25.1276,121.7392,12],"台北市":[25.0375,121.5637,11],"新北市":[25.012,121.465,10],"桃園市":[24.9937,121.301,10],
"新竹市":[24.804,120.971,12],"新竹縣":[24.839,121.018,10],"苗栗縣":[24.56,120.82,10],"台中市":[24.1477,120.6736,10],
"彰化縣":[24.0756,120.544,10],"南投縣":[23.916,120.684,9],"雲林縣":[23.708,120.542,10],"嘉義市":[23.4801,120.4491,12],
"嘉義縣":[23.4518,120.2555,10],"台南市":[22.9997,120.227,10],"高雄市":[22.6273,120.3014,10],"屏東縣":[22.6761,120.4942,10],
"宜蘭縣":[24.757,121.753,10],"花蓮縣":[23.9872,121.6015,10],"台東縣":[22.7554,121.15,10],"澎湖縣":[23.5712,119.5793,11],
"金門縣":[24.4494,118.3767,11],"連江縣":[26.1605,119.9517,11]};
const PREFIX=[["台北市","台北市"],["新北市","新北市"],["桃園市","桃園市"],["新竹市","新竹市"],["新竹縣","新竹縣"],["苗栗縣","苗栗縣"],["台中市","台中市"],["彰化縣","彰化縣"],["南投縣","南投縣"],["雲林縣","雲林縣"],["嘉義市","嘉義市"],["嘉義縣","嘉義縣"],["台南市","台南市"],["高雄市","高雄市"],["屏東縣","屏東縣"],["宜蘭縣","宜蘭縣"],["宜蘭市","宜蘭縣"],["花蓮縣","花蓮縣"],["花蓮市","花蓮縣"],["台東縣","台東縣"],["台東市","台東縣"],["澎湖縣","澎湖縣"],["金門縣","金門縣"],["連江縣","連江縣"],["基隆市","基隆市"]];
function normalizeCity(s){if(CITY_ORDER.includes(s.city))return s.city;for(const [p,c] of PREFIX){if((s.address||"").startsWith(p))return c}return s.city||""}
function districtOf(s){let a=(s.address||"").replace(normalizeCity(s),"");let m=a.match(/^(.+?(?:區|鄉|鎮|市))/);return m?m[1]:"其他"}
const stores=raw.map((s,i)=>({...s,idx:i,city:normalizeCity(s),districtName:districtOf(s)}));
document.querySelector('#total').textContent=stores.length;
const counts=Object.fromEntries(CITY_ORDER.map(c=>[c,0]));stores.forEach(s=>{if(counts[s.city]!==undefined)counts[s.city]++});

let map,geocoder,infoWindow;
const markers=new Map();
let cache={};try{cache=JSON.parse(localStorage.getItem('comebuy_google_geocodes_v1')||'{}')}catch(e){}
const q=document.querySelector('#q'),citySelect=document.querySelector('#citySelect'),statusEl=document.querySelector('#status');
citySelect.innerHTML='<option value="">全台城市</option>'+CITY_ORDER.map(c=>'<option value="'+c+'">'+c+' ('+counts[c]+')</option>').join('');

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function popupHtml(s){return '<div style="min-width:220px"><b style="font-size:16px">'+esc(s.name)+'</b><div style="margin-top:5px">'+esc(s.address)+'</div><div>區域：'+esc(s.districtName)+'</div><div>商圈：'+esc(s.district)+'</div><div>預估月租：'+esc(s.rent)+' 萬元</div><small>'+esc(s.basis)+'</small></div>'}
function visibleStores(){let term=q.value.trim().toLowerCase(),c=citySelect.value;return stores.filter(s=>(!c||s.city===c)&&(!term||[s.name,s.address,s.city,s.districtName,s.district].join(' ').toLowerCase().includes(term)))}
function isVisible(s){return visibleStores().some(x=>x.idx===s.idx)}
function addMarker(s,p){
  if(markers.has(s.idx)||!p)return;
  const marker=new google.maps.Marker({position:p,map:isVisible(s)?map:null,title:s.name});
  marker.addListener('click',()=>{infoWindow.setContent(popupHtml(s));infoWindow.open({map,anchor:marker})});
  markers.set(s.idx,marker);
}
function refreshMarkers(){
  const set=new Set(visibleStores().map(s=>s.idx));
  markers.forEach((m,i)=>m.setMap(set.has(i)?map:null));
  updateStatus();
}
function updateStatus(){statusEl.textContent='已定位 '+markers.size+' / '+stores.length+' 間門市';}
function saveCache(){try{localStorage.setItem('comebuy_google_geocodes_v1',JSON.stringify(cache))}catch(e){}}

window.initMap=function(){
  map=new google.maps.Map(document.getElementById('map'),{
    center:{lat:23.72,lng:120.96},
    zoom:7,
    renderingType: google.maps.RenderingType.RASTER,
    mapTypeControl:true,
    streetViewControl:true,
    fullscreenControl:false,
    gestureHandling:'greedy',
    clickableIcons:true
  });
  // Load activity overlay only after the Google Maps API is available.
  const activityScript=document.createElement('script');
  activityScript.src='/activity-layer.js?v=3';
  activityScript.onload=()=>window.COMEBUY_ACTIVITY?.attach(map);
  activityScript.onerror=()=>console.warn('Activity layer unavailable');
  document.body.appendChild(activityScript);
  window.__comebuyMap=map;
  geocoder=new google.maps.Geocoder();
  infoWindow=new google.maps.InfoWindow();
  google.maps.event.addListenerOnce(map,'tilesloaded',()=>{statusEl.textContent='Google Maps 已載入 · 已定位 '+markers.size+' / '+stores.length+' 間門市'});

  for(const [addr,p] of Object.entries(cache)){
    const s=stores.find(x=>x.address===addr);
    if(s&&p&&Number.isFinite(p.lat)&&Number.isFinite(p.lng))addMarker(s,p);
  }
  refreshMarkers();
  updateStatus();
  setTimeout(()=>geocodeAll(),500);
};

async function geocodeOne(s){
  if(markers.has(s.idx))return true;
  return new Promise(resolve=>{
    geocoder.geocode({address:s.address,region:'TW',componentRestrictions:{country:'TW'}},(results,status)=>{
      if(status==='OK'&&results&&results[0]){
        const loc=results[0].geometry.location;
        const p={lat:loc.lat(),lng:loc.lng()};
        cache[s.address]=p;saveCache();addMarker(s,p);updateStatus();resolve(true);
      }else if(status==='OVER_QUERY_LIMIT'){resolve('retry')}
      else resolve(false);
    })
  })
}
let running=false;
async function geocodeAll(){
  if(running)return;running=true;
  for(const s of stores){
    if(markers.has(s.idx))continue;
    let r=await geocodeOne(s);
    if(r==='retry'){await new Promise(res=>setTimeout(res,1400));r=await geocodeOne(s)}
    await new Promise(res=>setTimeout(res,280));
  }
  running=false;updateStatus();
}

citySelect.onchange=()=>{
  const c=citySelect.value;
  if(c&&CITY_CENTERS[c]){
    const [lat,lng,z]=CITY_CENTERS[c];map.panTo({lat,lng});map.setZoom(z);
  }else{map.panTo({lat:23.72,lng:120.96});map.setZoom(7)}
  refreshMarkers()
};
q.oninput=refreshMarkers;

const drawer=document.querySelector('#drawer'),drawerBody=document.querySelector('#drawerBody'),drawerTitle=document.querySelector('#drawerTitle'),backBtn=document.querySelector('#backBtn');
document.querySelector('#openList').onclick=()=>{drawer.classList.add('open');showCities()};
document.querySelector('#closeBtn').onclick=()=>drawer.classList.remove('open');
backBtn.onclick=()=>{if(nav.level==='store')showStores(nav.city,nav.district);else if(nav.level==='stores')showDistricts(nav.city);else if(nav.level==='districts')showCities();else drawer.classList.remove('open')};
let nav={level:'cities',city:null,district:null};
function menuRow(title,sub,count,onClick){
  const b=document.createElement('button');b.className='menurow';
  b.innerHTML='<div class="rowmain"><div class="rowtitle">'+esc(title)+'</div><div class="rowsub">'+esc(sub||'')+'</div></div><div class="count">'+count+'</div><div class="chev">›</div>';
  b.onclick=onClick;return b
}
function showCities(){
  nav={level:'cities',city:null,district:null};drawerTitle.textContent='城市';backBtn.style.visibility='hidden';drawerBody.innerHTML='';
  CITY_ORDER.forEach(c=>drawerBody.appendChild(menuRow(c,counts[c]?'查看區域與門市':'目前 0 間門市',counts[c],()=>{citySelect.value=c;citySelect.dispatchEvent(new Event('change'));showDistricts(c)})))
}
function showDistricts(c){
  nav={level:'districts',city:c,district:null};drawerTitle.textContent=c;backBtn.style.visibility='visible';drawerBody.innerHTML='';
  const ds=[...new Set(stores.filter(s=>s.city===c).map(s=>s.districtName))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  if(!ds.length){drawerBody.innerHTML='<div style="padding:24px;color:#766e69;text-align:center">目前沒有 COMEBUY 門市</div>';return}
  ds.forEach(d=>{const n=stores.filter(s=>s.city===c&&s.districtName===d).length;drawerBody.appendChild(menuRow(d,'查看分店',n,()=>showStores(c,d)))})
}
function showStores(c,d){
  nav={level:'stores',city:c,district:d};drawerTitle.textContent=c+' · '+d;backBtn.style.visibility='visible';drawerBody.innerHTML='';
  stores.filter(s=>s.city===c&&s.districtName===d).forEach(s=>drawerBody.appendChild(menuRow(s.name,s.address,'',()=>showStore(s))))
}
function showStore(s){
  nav={level:'store',city:s.city,district:s.districtName};drawerTitle.textContent='分店資訊';backBtn.style.visibility='visible';
  drawerBody.innerHTML='<div class="storecard"><h2>'+esc(s.name)+'</h2><div class="kv"><b>地址</b><br>'+esc(s.address)+'<br><b>城市／區域</b><br>'+esc(s.city)+' · '+esc(s.districtName)+'<br><b>商圈</b><br>'+esc(s.district)+'<br><b>預估月租</b><br>'+esc(s.rent)+' 萬元<br><b>備註</b><br>'+esc(s.basis)+'</div><div class="actions"><button class="primary" id="locate">定位門市</button><a class="secondary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address+' '+s.name)+'">Google 地圖</a></div></div>';
  document.querySelector('#locate').onclick=async()=>{
    if(!markers.has(s.idx))await geocodeOne(s);
    const m=markers.get(s.idx);if(m){map.panTo(m.getPosition());map.setZoom(17);infoWindow.setContent(popupHtml(s));infoWindow.open({map,anchor:m});drawer.classList.remove('open')}
  }
}
showCities();
</script>
<script>window.gm_authFailure=function(){const s=document.getElementById('status');if(s)s.textContent='Google Maps 驗證失敗：請檢查 API Key／計費／網站限制';}</script><script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8gz4dUPx-OVptXYPQ0_IErSFHKxUR_nY&callback=initMap&language=zh-TW&region=TW"></script>
</body>
</html>
