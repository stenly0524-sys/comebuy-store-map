name: Generate iPhone icon
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-icon.yml'
      - 'comebuy-map-icon.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cairosvg
      - name: Convert SVG to PNG
        run: python -c "import cairosvg; cairosvg.svg2png(url='comebuy-map-icon.svg',write_to='apple-touch-icon.png',output_width=512,output_height=512)"
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png
          git diff --cached --quiet || (git commit -m "Generate iOS PNG home screen icon" && git push)
